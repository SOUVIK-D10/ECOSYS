<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOSYS // Execution Terminal</title>
    <style>
        :root {
            --bg-dark: #0d1117;
            --bg-panel: #161b22;
            --text-main: #c9d1d9;
            --accent: #58a6ff;
            --danger: #f85149;
            --border: #30363d;
        }
        body {
            margin: 0; font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-dark); color: var(--text-main);
            display: flex; height: 100vh;
        }
        /* Sidebar Styles */
        .sidebar {
            width: 250px; background-color: var(--bg-panel);
            border-right: 1px solid var(--border); padding: 20px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .sidebar h2 { margin-top: 0; font-size: 1.2rem; color: var(--accent); }
        .nav-btn {
            background: transparent; color: var(--text-main);
            border: 1px solid var(--border); padding: 10px;
            cursor: pointer; text-align: left; font-family: inherit;
        }
        .nav-btn:hover { background-color: var(--border); }
        .nav-btn.danger { color: var(--danger); border-color: var(--danger); }
        
        /* Main Content Styles */
        .main { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .input-group { display: flex; gap: 10px; }
        input[type="text"] {
            flex: 1; padding: 10px; background-color: var(--bg-panel);
            border: 1px solid var(--border); color: var(--text-main);
            font-family: inherit;
        }
        button.execute {
            background-color: var(--accent); color: var(--bg-dark);
            border: none; padding: 10px 20px; cursor: pointer; font-weight: bold;
        }
        
        /* Task List Styles */
        #task-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px;}
        .task-item {
            background-color: var(--bg-panel); border: 1px solid var(--border);
            padding: 15px; display: flex; justify-content: space-between; align-items: center;
        }
        .task-title { font-weight: bold; }
        .task-meta { font-size: 0.85rem; color: #8b949e; }
        .task-actions { display: flex; gap: 10px; }
        .action-btn {
            background: transparent; border: 1px solid var(--accent);
            color: var(--accent); padding: 5px 10px; cursor: pointer; font-family: inherit; font-size: 0.8rem;
        }
        .action-btn:hover { background: var(--accent); color: var(--bg-dark); }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <h2>CORE // ECOSYS</h2>
        <button class="nav-btn" onclick="loadTasks('/tasks/', 'All Active')">[ ALL ACTIVE ]</button>
        <button class="nav-btn" onclick="loadTasks('/tasks/due_today', 'Due Today')">[ DUE TODAY ]</button>
        <button class="nav-btn danger" onclick="loadTasks('/tasks/overdue', 'Overdue')">[ OVERDUE ]</button>
    </div>

    <!-- Main Tactical Area -->
    <div class="main">
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Initialize new task...">
            <button class="execute" onclick="createTask()">EXECUTE</button>
        </div>
        
        <h3 id="current-view">Tasks: All Active</h3>
        <ul id="task-list"></ul>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const API_URL = "http://127.0.0.1:8000";
        let currentEndpoint = "/tasks/";

        // Fetch and display tasks
        async function loadTasks(endpoint = currentEndpoint, viewName = null) {
            currentEndpoint = endpoint;
            if (viewName) document.getElementById("current-view").innerText = `Tasks: ${viewName}`;
            
            try {
                const response = await fetch(API_URL + endpoint);
                const tasks = await response.json();
                renderTasks(tasks);
            } catch (error) {
                document.getElementById("task-list").innerHTML = `<li class="task-item" style="color: var(--danger)">SYSTEM OFFLINE: Cannot connect to API.</li>`;
            }
        }

        // Render tasks to the DOM with state action buttons
        function renderTasks(tasks) {
            const list = document.getElementById("task-list");
            list.innerHTML = ""; // Clear existing
            
            tasks.forEach(task => {
                const li = document.createElement("li");
                li.className = "task-item";
                li.innerHTML = `
                    <div>
                        <div class="task-title">[${task.state.toUpperCase()}] ${task.title}</div>
                        <div class="task-meta">ID: ${task.id} | Deadline: ${task.deadline ? task.deadline : 'None'}</div>
                    </div>
                    <div class="task-actions">
                        ${task.state === 'Backlog' ? `<button class="action-btn" onclick="updateState(${task.id}, 'In Progress')">START</button>` : ''}
                        ${task.state === 'In Progress' ? `<button class="action-btn" onclick="updateState(${task.id}, 'Completed')">COMPLETE</button>` : ''}
                    </div>
                `;
                list.appendChild(li);
            });
        }

        // Create a new task
        async function createTask() {
            const input = document.getElementById("taskInput");
            const title = input.value.trim();
            if (!title) return;

            await fetch(API_URL + "/tasks/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title: title, state: "Backlog" })
            });

            input.value = "";
            loadTasks(); // Refresh current view
        }

        // Update task state (The State Machine trigger)
        async function updateState(taskId, newState) {
            await fetch(`${API_URL}/tasks/${taskId}/state?new_state=${newState}`, {
                method: "PATCH"
            });
            loadTasks(); // Refresh current view to remove/update the task
        }

        // Initialize grid on load
        window.onload = () => loadTasks();
    </script>
</body>
</html>
